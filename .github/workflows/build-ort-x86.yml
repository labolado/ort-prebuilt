name: Build ORT x86

on:
  workflow_dispatch:
    inputs:
      ort_version:
        description: 'ONNX Runtime version (e.g. 1.20.1)'
        required: true
        default: '1.20.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Clone ONNX Runtime v${{ github.event.inputs.ort_version }}
        shell: bash
        run: |
          git clone --depth 1 --branch v${{ github.event.inputs.ort_version }} https://github.com/microsoft/onnxruntime.git /c/ort-src
          cd /c/ort-src
          git submodule update --init --recursive --depth 1

      - name: Patch build issues
        shell: bash
        run: |
          cd /c/ort-src
          # Fix 1: Remove Eigen hash check (GitLab archive hash instability)
          sed -i '/URL_HASH/d' cmake/external/eigen.cmake
          # Fix 2: Add missing #include <chrono> for VS2022 17.14+ compatibility
          sed -i '1s/^/#include <chrono>\n/' include/onnxruntime/core/platform/ort_mutex.h
          echo "Patches applied"

      - name: Build x86 shared library
        shell: cmd
        timeout-minutes: 120
        run: |
          cd /d C:\ort-src
          python tools\ci_build\build.py ^
            --build_dir build\x86 ^
            --config Release ^
            --x86 ^
            --parallel ^
            --skip_tests ^
            --skip_submodule_sync ^
            --compile_no_warning_as_error ^
            --build_shared_lib ^
            --cmake_generator "Visual Studio 17 2022"

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.ort_version }}"
          $pkg = "onnxruntime-win-x86-$ver"
          New-Item -ItemType Directory -Path "$pkg\lib", "$pkg\include" -Force | Out-Null
          Copy-Item "C:\ort-src\build\x86\Release\Release\onnxruntime.dll" "$pkg\lib\"
          Copy-Item "C:\ort-src\build\x86\Release\Release\onnxruntime.lib" "$pkg\lib\"
          Copy-Item "C:\ort-src\include\onnxruntime\core\session\onnxruntime_c_api.h" "$pkg\include\"
          Get-ChildItem "C:\ort-src\include\onnxruntime\core\session\*.h" | Copy-Item -Destination "$pkg\include\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$pkg\*" -DestinationPath "$pkg.zip"
          Write-Host "Built: $pkg.zip ($('{0:N1}' -f ((Get-Item "$pkg.zip").Length / 1MB)) MB)"

      - name: Create Release
        shell: bash
        run: |
          ver="${{ github.event.inputs.ort_version }}"
          tag="v${ver}-x86"
          pkg="onnxruntime-win-x86-${ver}.zip"
          gh release create "$tag" "$pkg" \
            --title "ORT ${ver} Windows x86" \
            --notes "ONNX Runtime ${ver} built from source for Windows x86 (32-bit). For use with Solar2D Windows Simulator." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
